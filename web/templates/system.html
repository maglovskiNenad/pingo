<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pingo</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            <span class="logo-p">P</span>ingo
        </div>

        <nav class="nav">
            <a href="/" class="nav-item active">Dashboard</a>
            <a href="/system" class="nav-item">System</a>
            <a href="/network" class="nav-item">Network</a>
            <a href="/services" class="nav-item">Services</a>
            <a href="/logs" class="nav-item">Logs</a>
        </nav>

    </aside>

    <main class="content">
        <h1>System</h1>  

    <div class="metric-card">
        <div class="metric-header">
            <h3>CPU</h3>
            <span id="cpu-usage">{{printf "%.1f" .CPU}}%</span>
        </div>

        <div class="metric-track">
            <div id="cpu-bar" class="metric-fill"></div>
        </div>
    </div>
    
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
